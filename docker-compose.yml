version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: civic_cascade_radar_db
    environment:
      POSTGRES_USER: civic_cascade_radar_user
      POSTGRES_PASSWORD: civic_cascade_radar_password
      POSTGRES_DB: civic_cascade_radar
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
